name: CI

on:
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    # GitHub Actions 用 Docker 容器跑 PostgreSQL，满足 "用 Docker 起 PostgreSQL" 的要求
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: careplan
          POSTGRES_USER: careplan
          POSTGRES_PASSWORD: careplan
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run migrations
        working-directory: backend
        env:
          POSTGRES_HOST: localhost   # service container 通过 localhost 访问
          POSTGRES_PORT: 5432
          POSTGRES_DB: careplan
          POSTGRES_USER: careplan
          POSTGRES_PASSWORD: careplan
          REDIS_HOST: localhost      # Celery 配置需要，但测试里 mock，不会真正连接
          OPENAI_API_KEY: ci-not-used
        run: python manage.py migrate --no-input

      - name: Run tests
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: careplan
          POSTGRES_USER: careplan
          POSTGRES_PASSWORD: careplan
          REDIS_HOST: localhost
          OPENAI_API_KEY: ci-not-used
          USE_MOCK_LLM: 'true'
        run: pytest -v --tb=short
